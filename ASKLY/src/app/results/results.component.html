<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Askly-results</title>
    <link rel="stylesheet" href="results.component.css">
</head>
<body class="div-container">
    <div>
    <!-- Header -->
    <header class="navbar">
        <div>
        <h1 class="brand">Askly</h1>
        <h5 class="slogan">Data that speaks</h5>
        </div>
        <button class="profile-btn" routerLink="/admin">Admin</button>
    </header>


    <!-- Main content -->
    <main class="results-container">
        <h2 class="results-title">Results</h2>
        <div class="results-list">
            <div class="result-item" *ngFor="let data of data">
                <div class="info">
                    <span class="title">{{data.title}}</span>
                    <span class="divider">|</span>
                    <span class="description">{{data.desc}}</span>
                    <span class="divider">|</span>
                </div>
                <button class="view-btn" [routerLink]="['/details/']" >View</button>
            </div>
    
        </div>
    </main>
</div>
</body>
</html>
