<div class="main-page">
  <!-- Hero Topics -->
  <div class="topics-bar">
    <a *ngFor="let topic of topics" [href]="topic.url" target="_blank" class="topic-chip">
      {{ topic.name }}
    </a>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Open Surveys (Left) -->
    <section class="open-surveys">
      <h2>Open Surveys</h2>
      <div class="survey-grid">
        <article *ngFor="let survey of openSurveys" class="survey-card" [routerLink]="['/survey-fill', survey.id]">
          <!-- <img [src]="survey.img || defaultImg" alt="Survey" class="survey-thumb"> -->
          <div class="survey-body">
            <h3>{{ survey.title }}</h3>
            <p>{{ survey.desc }}</p>
            <div class="survey-meta">
              <!-- <span class="tag">{{ survey.genre }}</span> -->
              <span class="date">{{ survey.createdAt | date:'dd MMM yyyy' }}</span>
            </div>
          </div>
        </article>
      </div>
      <p *ngIf="openSurveys.length === 0" class="empty">No open surveys right now.</p>
    </section>

    <!-- Closed Surveys (Right) -->
    <aside class="closed-surveys">
      <h2>Closed Surveys</h2>
      <div class="closed-list">
        <div *ngFor="let survey of closedSurveys" class="closed-item" [routerLink]="['/survey-details', survey.id]">
          <span class="title">{{ survey.title }}</span>
          <span class="badge">Closed</span>
        </div>
      </div>
      <p *ngIf="closedSurveys.length === 0" class="empty">No closed surveys.</p>
    </aside>
  </div>
</div>
