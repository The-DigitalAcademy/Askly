<div class="register-form-div">
  <form class="register-form">

    <h2>REGISTER</h2>

    <div class="reg-form">

      <div class="input">
        <label>First Name</label>
        <input type="text" id="name" name="name" placeholder="First Name" class="inputVal">
      </div>

      <div class="input">
        <label>Surname</label>
        <input type="text" id="surname" name="surname" placeholder="Last Name" class="inputVal">
      </div>


      <div class="input"><label>Role</label>
        <select id="role" name="role" class="inputVal">
          <option value="coordinator">Coordinator</option>
          <option value="respondent">Respondent</option>
        </select>
      </div>


      <div class="input"> <label>Email</label>
        <input type="email" id="email" name="email" placeholder="email" class="inputVal">
      </div>


      <div class="input"><label>Password</label>
        <input type="password" id="password" name="password" placeholder="password" class="inputVal">
      </div>


    </div>
    <div class="register-btn">
    <button type="button" class="register">Register</button>
 </div>
  </form>
</div>
